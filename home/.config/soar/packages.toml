# https://docs.pkgforge.dev/
# https://soar.qaidvoid.dev/quick-start

[defaults]
profile = "default"
binary_only = false

[packages]
ghostty = "*"
localsend = "*"
discord = "*"
btop = "*"

# the latest release is never a pre-release, so this filtering is unnecessary
# version_command = "curl -qfsSL https://api.github.com/repos/signalapp/signal-desktop/releases?per_page=10 | 'map(select(.prerelease == false)) | first | .tag_name'"
[packages.signal]
url = "https://updates.signal.org/desktop/signal-desktop.AppImage"
version_command = "curl -qfsSL https://api.github.com/repos/signalapp/signal-desktop/releases/latest | jq -r '.tag_name'"
version = "8.36.0"

# version_command = "curl -qfsSLI https://api.fluxer.app/dl/desktop/stable/linux/x64/latest/appimage | rg 'fluxer-stable-(.*)-x86_64.AppImage' -or '$1'"
[packages.fluxer]
url = "https://api.canary.fluxer.app/dl/desktop/canary/linux/x64/latest/appimage"
version_command = "curl -qfsSLI https://api.canary.fluxer.app/dl/desktop/canary/linux/x64/latest/appimage | rg 'Fluxer.*Canary-(.*)-linux-x86_64.AppImage' -or '$1'"
version = "2026.1127.154420"

[packages.kicad]
url = "https://mirrors.mit.edu/kicad/appimage/stable/kicad-{version}-x86_64.AppImage.tar"
hooks = { post_download = "7z x kicad" }
version_command = "curl -qfsSL https://api.github.com/repos/KiCad/kicad-source-mirror/releases/latest | rg -m 1 'kicad-(.*)-x86_64' -or '$1'"
version = "10.0.5"
pinned = true

[packages.arduino]
github = "arduino/arduino-ide"
asset_pattern = "arduino-ide_*_Linux_64bit.AppImage"
version = "2.3.8"
pinned = true

[packages.vscodium]
github = "vscodium/vscodium"
asset_pattern = "VSCodium-*-x86_64.AppImage"
version = "1.143.17232"

[packages.prusaslicer]
github = "sarrchri/PrusaSlicer.AppImage"
asset_pattern = "PrusaSlicer-*-anylinux-x86_64.AppImage"
version = "2.9.7-1@2026-11-21_1795273389"

[packages.handy]
github = "cjpais/handy"
asset_pattern = "Handy_*_amd64.AppImage"
version = "0.10.2"

[packages.caligula]
github = "ifd3f/caligula"
asset_pattern = "caligula-x86_64-linux"
version = "*"

[packages.yaak]
github = "mountain-loop/yaak"
asset_pattern = "yaak_*_amd64.AppImage"
version = "2026.9.1"

[packages.jellybox]
github = "avdept/jellyboxplayer"
asset_pattern = "JellyBox-x86_64.AppImage"
version = "2.13.0"

[packages.termix]
github = "termix-ssh/termix"
asset_pattern = "termix_linux_x64_appimage.AppImage"
version = "26.11.3"

[packages.navibeat]
github = "nenadjokic/navibeat-linux"
asset_pattern = "NaviBeat-linux-x86_64.AppImage"
version = "1.0.90"

[packages.psysonic]
github = "Psysonic/psysonic"
asset_pattern = "Psysonic_*_amd64.AppImage"
version = "app-v1.56.0"

[packages.inlark]
github = "inlark/inlark"
asset_pattern = "inlark-*-x86_64.AppImage"
version = "0.8.0"

[packages.yapfast]
github = "yapfast/yapfast"
asset_pattern = "Yapfast-*-x86_64.AppImage"
version = "0.4.1"

[packages.tuma]
github = "MorrisKM/Tuma"
asset_pattern = "Tuma_*_amd64.AppImage"
version = "1.6.0"

[packages.backtickle]
github = "masud90/backtickle"
asset_pattern = "Backtickle_*_amd64.AppImage"
version = "0.2.1"

[packages.stash]
github = "itsmeares/staaash"
asset_pattern = "Staaash-Desktop-*-x86_64.AppImage"
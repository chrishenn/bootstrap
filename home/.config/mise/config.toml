[settings]
experimental = true
registry_floating = true
auto_update = true
trusted_config_paths = ["/"]

dotfiles.root = "~/Projects/bootstrap/home"
dotfiles.default_mode = "copy"

[env]
FNOX_AGE_KEY_FILE = "$HOME/.ssh/id_ed25519"
FNOX_CONFIG_DIR = "$HOME/.config/fnox"
MISE_AGE_KEY_FILE = "$HOME/.ssh/id_ed25519"
STARSHIP_CONFIG = "$HOME/.config/starship/starship.toml"

TERM = "xterm-256color"
EDITOR = "nano"
KUBE_EDITOR = "nano"
COMPOSE_BAKE = true
OP_RUN_NO_MASKING = true

HK_MISE = 1
UV_PREVIEW = 1
JUST_UNSTABLE = 1

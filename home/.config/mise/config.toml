[settings]
self_update.auto = true
tool_update.global_auto = "12h"
trusted_config_paths = ["/"]

experimental = true
registry_floating = true

dotfiles.root = "~/Projects/bootstrap/home"
dotfiles.default_mode = "copy"

[env]
FNOX_AGE_KEY_FILE = "~/.ssh/id_ed25519"
FNOX_CONFIG_DIR = "~/.config/fnox"
MISE_AGE_KEY_FILE = "~/.ssh/id_ed25519"
STARSHIP_CONFIG = "~/.config/starship/starship.toml"

TERM = "xterm-256color"
EDITOR = "nano"
KUBE_EDITOR = "nano"
COMPOSE_BAKE = true
OP_RUN_NO_MASKING = true

HK_MISE = 1
UV_PREVIEW = 1
JUST_UNSTABLE = 1

# conflicts with https remote needed by bootstrap from github
[bootstrap.repos]
"~/Projects/bootstrap" = { url = "https://github.com/chrishenn/bootstrap.git" }

[history.encryption]
recipients = ["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBDbuPSH93RCTHG7iTHxg+De/yMWUVB+Q4EFt4llpPDL"]

[dotfiles]
"~/.bash_aliases" = { mode = "symlink", variants = [{ os = "linux" }] }
"~/.bashrc" = { mode = "symlink", variants = [{ os = "linux" }] }
"~/.config/Code/User" = {}
"~/.config/Kvantum" = {}
"~/.config/Proton" = {}
"~/.config/atuin/config.toml" = {}
"~/.config/bottom/bottom.toml" = {}
"~/.config/dolphinrc" = {}
"~/.config/easyeffects" = {}
"~/.config/fnox/config.toml" = {}
"~/.config/ghostty" = { mode = "symlink" }
"~/.config/glab-cli" = {}
"~/.config/input-remapper-2" = {}
"~/.config/mbx/config.toml" = {}
"~/.config/mise/" = { mode = "symlink-each" }
"~/.config/no-show-user-motd" = {}
"~/.config/nushell/config.nu" = {}
"~/.config/rc/config.toml" = { mode = "template" }
"~/.config/scoop/config.json" = { mode = "template", variants = [{ os = "windows" }] }
"~/.config/soar" = { mode = "symlink" }
"~/.config/starship/starship.toml" = {}
"~/.config/tealdeer/config.toml" = {}
"~/.config/topgrade/topgrade.toml" = { mode = "symlink" }
"~/.config/wezterm/wezterm.lua" = {}
"~/.config/yazi/yazi.toml" = {}
"~/.config/zed/settings.json" = {}
"~/.config/zellij/config.kdl" = {}
"~/.gitconfig" = { mode = "copy", variants = [{ os = "linux" }] }
"~/.hushlogin" = {}
"~/.local/share/color-schemes/UtterlySweet.colors" = {}
"~/.local/share/custom_icons" = {}
"~/.local/share/konsole/Profile 1.profile" = {}
"~/.local/share/konsole/Utterly-Sweet-Konsole.colorscheme" = {}
"~/.local/share/plasma-systemmonitor" = {}
"~/.local/share/wallpapers/back.png" = {}
"~/.profile" = {}
"~/.yt-dlp/config" = {}
"~/.zprofile" = {}
"~/.zshrc" = {}
"~/gclone.sh" = {}
"~/justfile" = {}
"~/Documents/PowerShell/Microsoft.PowerShell_profile.ps1" = { mode = "copy", variants = [{ os = "windows" }] }

"~/.ssh/authorized_keys" = { mode = "template", permissions = "0600" }
"~/.ssh/id_ed25519.pub" = { mode = "template", permissions = "0644" }
"~/.ssh/id_ed25519" = { mode = "template", permissions = "0600" }
"~/.ssh/known_hosts" = { mode = "template", permissions = "0600" }

[dotfiles.mpv]
source = "~/Projects/bootstrap/home/.config/mpv/mpv.conf"
variants = [
  { os = "linux", target = "~/.config/mpv/mpv.conf" },
  { os = "windows", target = "~/AppData/Roaming/mpv/mpv.conf" },
]

[dotfiles.gh]
source = "~/Projects/bootstrap/home/.config/gh"
variants = [{ os = "linux", target = "~/.config/gh" }, { os = "windows", target = "~/AppData/Roaming/Github CLI/" }]

[tasks]
[tasks.apply]
alias = "a"
run = "mise dot apply -y"

[tasks.boot]
alias = "b"
run = "mise bootstrap --skip-dirty"

[tasks.pkg]
alias = "p"
run = "mise bootstrap packages"

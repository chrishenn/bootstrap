[settings]
system_packages.ostree = "layer"

[bootstrap.groups.chris]
system = true
gid = 1000

[bootstrap.users.chris]
system = true
group = "chris"
groups = ["docker", "incus-admin", "libvirt", "wheel"]
uid = 1000

[bootstrap.brew]
adopt = true

[bootstrap.brew.taps]
"ublue-os/tap" = "https://github.com/ublue-os/homebrew-tap.git"
"stalwartlabs/tap" = "https://github.com/stalwartlabs/homebrew-tap.git"
"suzuki-shunsuke/ghtkn" = "https://github.com/suzuki-shunsuke/homebrew-ghtkn.git"

[bootstrap.packages]
# only "tapped casks" with no preflight_ or postflight_steps are supported by mise
# "brew-cask:ublue-os/tap/zed-linux" = "latest"
# "brew-cask:ublue-os/tap/1password-gui-linux" = "latest"
# "brew-cask:ublue-os/tap/jetbrains-toolbox-linux" = "latest"
"brew-cask:font-fira-code-nerd-font" = "latest"
"brew-cask:font-jetbrains-mono-nerd-font" = "latest"

"brew:feroxbuster" = "latest"
"brew:media-info" = "latest"
"brew:parallel" = "latest"
"brew:trash-cli" = "latest"
"brew:stalwartlabs/tap/stalwart-cli" = "latest"

"flatpak:io.mpv.Mpv" = "latest"
"flatpak:org.kde.haruna" = "latest"
"flatpak:org.kde.kdenlive" = "latest"
"flatpak:com.belmoussaoui.Obfuscate" = "latest"
"flatpak:org.darktable.Darktable" = "latest"
"flatpak:com.github.wwmm.easyeffects" = "latest"
"flatpak:org.audacityteam.Audacity" = "latest"
"flatpak:md.obsidian.Obsidian" = "latest"
"flatpak:io.github.cboxdoerfer.FSearch" = "latest"
"flatpak:com.prusa3d.PrusaSlicer" = "latest"
"flatpak:org.onlyoffice.desktopeditors" = "latest"
"flatpak:io.missioncenter.MissionCenter" = "latest"
"flatpak:me.iepure.devtoolbox" = "latest"
"flatpak:com.github.tchx84.Flatseal" = "latest"
"flatpak:io.github.flattool.Warehouse" = "latest"
"flatpak:com.vysp3r.ProtonPlus" = "latest"
"flatpak:org.deskflow.deskflow" = "latest"
"flatpak:io.gitlab.adhami3310.Converter" = "latest"
"flatpak:com.valvesoftware.Steam" = "latest"
"flatpak:com.obsproject.Studio" = "latest"
"flatpak:com.obsproject.Studio.Plugin.DroidCam" = "latest"
# heic extension never reports installed, so reinstalls on every 'packages apply'. annoying
"flatpak:org.gnome.Loupe" = "latest"
# "flatpak:org.gnome.Loupe.HEIC" = "latest"
"flatpak:be.alexandervanhee.gradia" = "latest"
"flatpak:io.github.DenysMb.Kontainer" = "latest"
"flatpak:org.fedoraproject.MediaWriter" = "latest"
"flatpak:io.github.getnf.embellish" = "latest"
"flatpak:com.usebottles.bottles" = "latest"

# declarative removal not supported for flatpak (yet)
# "flatpak:org.gnome.DejaDup" = { state = "absent" }
# "flatpak:org.mozilla.Thunderbird" = { state = "absent" }
# "flatpak:org.mozilla.firefox" = { state = "absent" }
# "flatpak:org.kde.skanpage" = { state = "absent" }
# "flatpak:org.kde.okular" = { state = "absent" }
# "flatpak:org.kde.kontact" = { state = "absent" }
# "flatpak:org.kde.kclock"= { state = "absent" }
# "flatpak:org.fkoehler.KTailctl"= { state = "absent" }

"rpm-ostree:firefox" = "latest"
"rpm-ostree:google-chrome-stable" = "latest"
"rpm-ostree:kvantum" = "latest"
"rpm-ostree:proton-vpn-gnome-desktop" = "latest"
"rpm-ostree:musl-devel" = "latest"
"rpm-ostree:musl-gcc" = "latest"
"rpm-ostree:musl-libc-static" = "latest"

[bootstrap.hooks.post-packages]
run = """
# flatpak fix: a bunch didn't launch ootb due to file perm issue
systemctl --user restart xdg-document-portal.service
# allow obs droidcam to access media devices?
flatpak override --user --device=all com.obsproject.Studio
"""

[bootstrap.hooks.final]
run = """
sudo sysctl -q --system
sudo nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml --quiet
"""

# sysctl
[bootstrap.files."/etc/sysctl.d/99-custom.conf"]
content = """
net.ipv4.ip_nonlocal_bind=1
vm.overcommit_memory=1
fs.inotify.max_user_watches=1014796
fs.inotify.max_user_instances=1014796
fs.inotify.max_queued_events=1014796
net.ipv6.conf.all.disable_ipv6=1
"""
owner = "root"
group = "root"
mode = "0644"

# docker config
[bootstrap.files."/etc/docker/daemon.json"]
content = """
{
    "registry-mirrors": ["https://zot.henn.dev"],
    "default-runtime": "nvidia",
    "runtimes": {
        "nvidia": {
            "args": [],
            "path": "nvidia-container-runtime"
        }
    },
    "log-level": "warn",
    "log-driver": "json-file",
    "log-opts": {
        "max-size": "10m",
        "max-file": "5"
    },
    "default-address-pools": [
        {
            "base": "172.16.0.0/12",
            "size": 24
        }
    ]
}
"""
owner = "root"
group = "root"
mode = "0644"

# protonvpn repo
[bootstrap.files."/etc/yum.repos.d/protonvpn-stable.repo"]
content = """
[protonvpn-fedora-stable]
name = ProtonVPN Fedora Stable repository
baseurl = https://repo.protonvpn.com/fedora-$releasever-stable
enabled = 1
gpgcheck = 1
repo_gpgcheck = 0
skip_if_unavailable = true
gpgkey = https://repo.protonvpn.com/fedora-$releasever-stable/public_key.asc
"""
owner = "root"
group = "root"
mode = "0644"
phase = "pre-packages"

# chrome repo
[bootstrap.files."/etc/yum.repos.d/google-chrome.repo"]
content = """
[google-chrome]
name = google-chrome
baseurl = https://dl.google.com/linux/chrome/rpm/stable/x86_64
enabled = 1
gpgcheck = 1
gpgkey = https://dl.google.com/linux/linux_signing_key.pub
"""
owner = "root"
group = "root"
mode = "0644"
phase = "pre-packages"

# services
[bootstrap.services.docker]
state = "running"
enabled = true
on_change = "reload_or_restart"


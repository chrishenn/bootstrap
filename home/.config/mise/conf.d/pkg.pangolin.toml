# pangolin site running on host as systemd service

[bootstrap.secrets]
pangolin_site_provision = "PANGOLIN_SITE_PROVISION"
pangolin_endpoint = "PANGOLIN_ENDPOINT"
pangolin_site_name = "PANGOLIN_SITE_NAME"
pangolin_domain = "PANGOLIN_DOMAIN"

[bootstrap.hooks.post-packages]
run = "mise install --system 'github:fosrl/cli[rename_exe=pangolin]' >&/dev/null"

[bootstrap.directories."/etc/pangolin/"]

[bootstrap.files."/etc/systemd/system/pangolin-site.service"]
content = """
[Unit]
Description=Pangolin Site
Wants=network-online.target
After=network-online.target

[Service]
Type=simple
User=root
Group=root
ExecStart=/usr/local/share/mise/installs/github-fosrl-cli/latest/pangolin \
    up site \
    --name '{{secret(name="pangolin_site_name")}}' \
    --endpoint {{secret(name="pangolin_endpoint")}} \
    --provisioning-key '{{secret(name="pangolin_site_provision")}}' \
    --provisioning-blueprint-file /etc/pangolin/bootstrap.yaml
Restart=always
RestartSec=2
UMask=0077
PrivateTmp=true

[Install]
WantedBy=multi-user.target
"""
template = true
owner = "root"
group = "root"
mode = "0644"
notify = ["pangolin-site"]

[bootstrap.files."/etc/pangolin/bootstrap.yaml"]
content = """
public-resources:
  host-ssh:
    name: Host SSH
    mode: ssh
    full-domain: "{{secret(name="pangolin_site_name")}}.{{secret(name="pangolin_domain")}}"
    policy: chris
    sites:
      - {{secret(name="pangolin_site_name")}}
    tcp-ports: "2200"
"""
template = true

[bootstrap.services.pangolin-site]
state = "running"
enabled = true
on_change = "reload_or_restart"

# power shortcuts

[vars]
pwr_user = "chris"

[bootstrap.files."~/.local/share/applications/restart.desktop"]
template = true
content = """
[Desktop Entry]
Name=Restart
Exec=bash -c "sudo {{ env.HOME }}/.local/share/applications/restart.sh"
Comment=Restart
Terminal=true
Type=Application
Icon=system-reboot
"""

[bootstrap.files."~/.local/share/applications/shutdown.desktop"]
template = true
content = """
[Desktop Entry]
Name=Shutdown
Exec=bash -c "sudo {{ env.HOME }}/.local/share/applications/shutdown.sh"
Comment=Shutdown
Terminal=true
Type=Application
Icon=system-shutdown
"""

[bootstrap.files."~/.local/share/applications/restart.sh"]
content = "reboot now"
mode = "0755"

[bootstrap.files."~/.local/share/applications/shutdown.sh"]
content = "shutdown now"
mode = "0755"

[bootstrap.files."/etc/sudoers.d/pwr"]
# {{ exec(command='whoami') }} ALL=(root) NOPASSWD:{{ env.HOME }}/.local/share/applications/shutdown.sh
# {{ exec(command='whoami') }} ALL=(root) NOPASSWD:{{ env.HOME }}/.local/share/applications/restart.sh
content = """
{{ vars.pwr_user }} ALL=(root) NOPASSWD:{{ env.HOME }}/.local/share/applications/shutdown.sh
{{ vars.pwr_user }} ALL=(root) NOPASSWD:{{ env.HOME }}/.local/share/applications/restart.sh
"""
template = true
owner = "root"
group = "root"
mode = "0440"

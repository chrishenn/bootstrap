# todo: op provider is read-only per the docs, but error message from fnox calls out op as a compatible r/w provider type
# doc is also confused https://fnox.jdx.dev/guide/files.html#store-a-file

default_provider = "op"
if_missing = "warn"

[providers.op]
type = "1password"

[providers.age]
type = "age"
recipients = ["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBDbuPSH93RCTHG7iTHxg+De/yMWUVB+Q4EFt4llpPDL"]
key_file = "~/.ssh/id_ed25519"

[secrets]
OP_SERVICE_ACCOUNT_TOKEN = { provider = "op", value = "op://homelab/op_homelab/credential", sync = { provider = "age", value = "fnox-age-batch-v1::" } }
GITHUB_TOKEN = { provider = "op", value = "op://homelab/github/credential", sync = { provider = "age", value = "fnox-age-batch-v1::gTu+StLKRPf4wWLfhv2qOnlzUB6iazghtIjAMoGvMu+vBlUPWZWUn/Y9jhyn7YCf07Cr7tTmDipRaSo2ugSMSZPFZB0=" } }

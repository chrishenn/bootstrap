# note: op provider for ssh private key file is broken. Bootstrap from age by setting FNOX_AGE_KEY
# todo: op provider is read-only per the docs, but error message from fnox calls out op as a compatible r/w provider type
# doc is also confused https://fnox.jdx.dev/guide/files.html#store-a-file
# todo: fnox.files write for op provider is stripping newlines from id_ed25519 private key, breaking git/ssh
# todo: if default provider op is not available, fnox will not fall back to 'sync' provider age. This means that on bootstrap,
# provider op must be authenticated, and we cannot solely bootstrap from age while keeping a single source of truth in op
# that can be simply synced to encrypted age text in this file (or mise config.toml)
# However! Having the op provider logged in means that id_ed private key will be rendered to disk broken!! Since the op
# provider strips trailing newlines on fnox files write.
# mise dot apply insists on connecting to the op provider even when age creds are present in the shell, and op is not needed

default_provider = "op"
if_missing = "warn"

[providers.op]
type = "1password"
vault = "homelab"

[providers.age]
type = "age"
recipients = ["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBDbuPSH93RCTHG7iTHxg+De/yMWUVB+Q4EFt4llpPDL"]
key_file = "~/.ssh/id_ed25519"

[secrets]
OP_SERVICE_ACCOUNT_TOKEN = { provider = "op", sync = { provider = "age", value = "fnox-age-batch-v1::" }, value = "op://homelab/op_homelab/credential" }
GITHUB_TOKEN = { provider = "op", sync = { provider = "age", value = "fnox-age-batch-v1::eS3GY2IStEKiSPG62SI48QnQWDokTjMup9aIgpgz/DiRCD9ZBGplod0jNubNU9oT7CweYJN8EHmOjcfFg7FS2lZybvU=" }, value = "op://homelab/github/credential" }
PANGOLIN_SITE_PROVISION = { provider = "op", sync = { provider = "age", value = "fnox-age-batch-v1::DWXvRl32p/O3psFkq4TqUpB3pnYLDIqj+GAjZFNRzbZ652ODONtxXiZbthxGzLmRSKJcDEWnEv5sViZ7iFHjSa1aZWsoB1SzfbmMFGlQsj7CAgM+q3vNkA==" }, value = "op://homelab/pangolin/site_provision" }
MBX_REMOTE_TOKEN = { provider = "op", sync = { provider = "age", value = "fnox-age-batch-v1::9POe62saJwNqdxDEKubQDsdo3U4RSKGBU3KxM5ohX658r0Gh5u/W9gfASTtFx684rGaMzRRYNneee22EvfUeNvFly/koRUN+OGYDrWubBReaqCmGVjBtnGzqav0=" }, value = "op://homelab/mbx/credential" }
MISE_TASK_CACHE_REMOTE_TOKEN = { provider = "op", sync = { provider = "age", value = "fnox-age-batch-v1::3y0c/n47WCz9Uw0gnIMaNpxhx7oayJ2E26OureywxS7i63l6VhcxDipguYYKUWwA/Wtxg6Qg3dkGcVazlViVmCO09B/VyKhnQ2QTtrIuOsY87rivuutMHeAsn2A=" }, value = "op://homelab/mbx/credential" }

[files]
"~/.ssh/authorized_keys" = { provider = "op", sync = { provider = "age", value = "fnox-age-batch-v1::" }, value = "op://homelab/authorized_keys/text" }
"~/.ssh/known_hosts" = { provider = "op", sync = { provider = "age", value = "fnox-age-batch-v1::" }, value = "op://homelab/known_hosts/text" }
"~/.ssh/id_ed25519.pub" = { provider = "op", sync = { provider = "age", value = "fnox-age-batch-v1::myoZdSfVJmy1a1Sj/qxi7yfwcDFodNvSDZGPphYbztiRNuDYuHTjhxjgDKmmQzRti4uHvps6wfgvlKcgn/qHbIhF6amys36Xph3qKGRv3dm+XYcEyJQXYTVXNkMntzCEQJY2W7OIIFwlzL9R" }, value = "op://homelab/dkey/public key" }

# todo: op provider is buggy (strips leading whitespace and trailing newlines)
#"~/.ssh/id_ed25519"= { provider ="op", value = "op://homelab/dkey/private key?ssh-format=openssh" }
"~/.ssh/id_ed25519" = { provider = "age", value = "" }

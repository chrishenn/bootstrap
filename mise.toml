[settings]
experimental = true
registry_floating = true
auto_update = true
trusted_config_paths = ["/"]

dotfiles.root = "~/Projects/bootstrap/home"
dotfiles.default_mode = "copy"

[env]
FNOX_AGE_KEY_FILE = "~/.ssh/id_ed25519"
FNOX_CONFIG_DIR = "~/.config/fnox"
MISE_AGE_KEY_FILE = "~/.ssh/id_ed25519"
TERM = "xterm-256color"
EDITOR = "nano"
KUBE_EDITOR = "nano"
COMPOSE_BAKE = true
OP_RUN_NO_MASKING = true

HK_MISE = 1
UV_PREVIEW = 1
JUST_UNSTABLE = 1

[tools]
semver = { version = "latest", os = ["linux"] }
jless = { version = "latest", os = ["linux"] }
dust = "latest"
bottom = "latest"
gh = "latest"
bat = "latest"
eza = "latest"
fd = "latest"
rg = "latest"
jq = "latest"
sd = "latest"
yq = "latest"
jqp = "latest"
yazi = "latest"
fzf = "latest"

op = "latest"
fnox = "latest"
starship = "latest"
zoxide = "latest"
zellij = "latest"
atuin = "latest"

just = { version = "latest", os = ["linux"] }
powershell = { version = "latest", os = ["linux"] }
television = { version = "latest", os = ["linux"] }
rclone = { version = "latest", os = ["linux"] }
aws-cli = { version = "latest", os = ["linux"] }
ruff = { version = "latest", os = ["linux"] }
shellcheck = { version = "latest", os = ["linux"] }
mr-boxington = { version = "latest", os = ["linux"] }
helm = { version = "latest", os = ["linux"] }

rust = { version = "latest", os = ["linux"] }
go = { version = "latest", os = ["linux"] }
zig = { version = "latest", os = ["linux"] }
zls = { version = "latest", os = ["linux"] }
lua = { version = "latest", os = ["linux"] }

bun = "latest"
node = { version = "latest", os = ["linux"] }
pnpm = { version = "latest", os = ["linux"] }
npm = { version = "latest", os = ["linux"] }

"cargo:tealdeer" = { version = "latest", os = ["linux"] }
"cargo:tokei" = { version = "latest", os = ["linux"] }
"cargo:dysk" = { version = "latest", os = ["linux"] }
"cargo:nu" = { version = "latest", os = ["linux"] }
"cargo:topgrade" = { version = "latest", os = ["linux"] }
"cargo:cargo-update" = { version = "latest", os = ["linux"] }
"cargo:cargo-binstall" = { version = "latest", os = ["linux"] }
"cargo:cargo-dist" = { version = "latest", os = ["linux"] }

[history.encryption]
recipients = [
    "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBDbuPSH93RCTHG7iTHxg+De/yMWUVB+Q4EFt4llpPDL",
]

[bootstrap.repos]
"~/Projects/bootstrap" = { url = "git@github.com:chrishenn/bootstrap.git" }

[dotfiles]
"~/.bash_aliases" = {}
"~/.bashrc" = { variants = [{ os = "linux"}] }
"~/.config/1Password/ssh/agent.toml" = {}
"~/.config/Code/User" = {}
"~/.config/Kvantum" = {}
"~/.config/Proton" = {}
"~/.config/atuin/config.toml" = {}
"~/.config/bottom/bottom.toml" = {}
"~/.config/dolphinrc" = {}
"~/.config/ghostty" = {}
"~/.config/glab-cli" = {}
"~/.config/input-remapper-2" = {}
"~/.config/mbx/config.toml" = {}
"~/.config/mise/config.toml" = { source = "~/Projects/bootstrap/mise.toml" }
"~/.config/no-show-user-motd" = {}
"~/.config/nushell/config.nu" = {}
"~/.config/soar" = {}
"~/.config/starship.toml" = {}
"~/.config/tealdeer/config.toml" = {}
"~/.config/topgrade/topgrade.toml" = {}
"~/.config/wezterm/wezterm.lua" = {}
"~/.config/zed/settings.json" = {}
"~/.config/zellij/config.kdl" = {}
"~/.gitconfig" = { source = "~/Projects/bootstrap/home/.gitconfig.tera", mode = "template" }
"~/.hushlogin" = {}
"~/.local/share/color-schemes/UtterlySweet.colors" = {}
"~/.local/share/custom_icons" = {}
"~/.local/share/easyeffects/autoload/output/mydefault.txt" = {}
"~/.local/share/konsole/Profile 1.profile" = {}
"~/.local/share/konsole/Utterly-Sweet-Konsole.colorscheme" = {}
"~/.local/share/plasma-systemmonitor" = {}
"~/.local/share/wallpapers/back.png" = {}
"~/.profile" = {}
"~/.yt-dlp/config" = {}
"~/.zprofile" = {}
"~/.zshrc" = {}
"~/gclone.sh" = {}
"~/justfile" = {}

"~/.ssh/authorized_keys" = { source = "~/Projects/bootstrap/home/.ssh/authorized_keys.tera", mode = "template" }
"~/.ssh/id_ed25519.pub" = { source = "~/Projects/bootstrap/home/.ssh/id_ed25519.pub.tera", mode = "template" }
"~/.ssh/id_ed25519" = { source = "~/Projects/bootstrap/home/.ssh/id_ed25519.tera", mode = "template" }
"~/.ssh/known_hosts" = { source = "~/Projects/bootstrap/home/.ssh/known_hosts.tera", mode = "template" }

"~/.config/scoop/config.json" = { source = "~/Projects/bootstrap/home/.config/scoop/config.json", mode = "template" }
"~/Documents/PowerShell/Microsoft.PowerShell_profile.ps1" = {}

[dotfiles.fnox]
# fnox does not respect FNOX_CONFIG_DIR on windows
source = "~/Projects/bootstrap/home/.config/fnox/config.toml"
variants = [
    { os = "linux", target = "~/.config/fnox/config.toml" },
    { os = "windows", target = "~/AppData/Local/fnox/config.toml" },
]

[dotfiles.mpv]
source = "~/Projects/bootstrap/home/.config/mpv/mpv.conf"
variants = [
    { os = "linux", target = "~/.config/mpv/mpv.conf" },
    { os = "windows", target = "~/AppData/Roaming/mpv/mpv.conf" },
]

[dotfiles.gh]
source = "~/Projects/bootstrap/home/.config/gh"
variants = [
    { os = "linux", target = "~/.config/gh" },
    { os = "windows", target = "~/AppData/Roaming/Github CLI/" },
]

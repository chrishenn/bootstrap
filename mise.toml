[settings]
dotfiles.root = "~/Projects/bootstrap/home"
dotfiles.default_mode = "copy"

[bootstrap.repos]
"~/Projects/bootstrap" = { url = "git@github.com:chrishenn/bootstrap.git" }

[history.encryption]
recipients = ["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBDbuPSH93RCTHG7iTHxg+De/yMWUVB+Q4EFt4llpPDL"]

[dotfiles]
"~/.bash_aliases" = { mode = "symlink", variants = [{ os = "linux" }] }
"~/.bashrc" = { mode = "copy", variants = [{ os = "linux" }] }
"~/.config/Code/User" = {}
"~/.config/Kvantum" = {}
"~/.config/Proton" = {}
"~/.config/atuin/config.toml" = {}
"~/.config/bottom/bottom.toml" = {}
"~/.config/dolphinrc" = {}
"~/.config/fnox/config.toml" = {}
"~/.config/ghostty" = {}
"~/.config/glab-cli" = {}
"~/.config/input-remapper-2" = {}
"~/.config/mbx/config.toml" = {}
"~/.config/mise/" = {}
"~/.config/no-show-user-motd" = {}
"~/.config/nushell/config.nu" = {}
"~/.config/soar" = { mode = "symlink" }
"~/.config/starship/starship.toml" = {}
"~/.config/tealdeer/config.toml" = {}
"~/.config/topgrade/topgrade.toml" = {}
"~/.config/wezterm/wezterm.lua" = {}
"~/.config/yazi/yazi.toml" = {}
"~/.config/zed/settings.json" = {}
"~/.config/zellij/config.kdl" = {}
"~/.gitconfig" = { source = "~/Projects/bootstrap/home/.gitconfig.tera", mode = "template" }
"~/.hushlogin" = {}
"~/.local/share/color-schemes/UtterlySweet.colors" = {}
"~/.local/share/custom_icons" = {}
"~/.local/share/easyeffects/autoload/output/mydefault.txt" = {}
"~/.local/share/konsole/Profile 1.profile" = {}
"~/.local/share/konsole/Utterly-Sweet-Konsole.colorscheme" = {}
"~/.local/share/plasma-systemmonitor" = {}
"~/.local/share/wallpapers/back.png" = {}
"~/.nanorc" = {}
"~/.profile" = {}
"~/.yt-dlp/config" = {}
"~/.zprofile" = {}
"~/.zshrc" = {}
"~/gclone.sh" = {}
"~/justfile" = {}

"~/.ssh/authorized_keys" = { source = "~/Projects/bootstrap/home/.ssh/authorized_keys.tera", mode = "template", permissions = "0600" }
"~/.ssh/id_ed25519.pub" = { source = "~/Projects/bootstrap/home/.ssh/id_ed25519.pub.tera", mode = "template", permissions = "0644" }
"~/.ssh/id_ed25519" = { source = "~/Projects/bootstrap/home/.ssh/id_ed25519.tera", mode = "template", permissions = "0600" }
"~/.ssh/known_hosts" = { source = "~/Projects/bootstrap/home/.ssh/known_hosts.tera", mode = "template", permissions = "0600" }

[dotfiles.scoop]
source = "~/Projects/bootstrap/home/.config/scoop/config.json"
mode = "template"
variants = [{ os = "windows", target = "~/.config/scoop/config.json" }]

[dotfiles.pwsh]
source = "~/Projects/bootstrap/home/Documents/PowerShell/Microsoft.PowerShell_profile.ps1"
variants = [
  { os = "windows", target = "~/Documents/PowerShell/Microsoft.PowerShell_profile.ps1" },
]

[dotfiles.mpv]
source = "~/Projects/bootstrap/home/.config/mpv/mpv.conf"
variants = [
  { os = "linux", target = "~/.config/mpv/mpv.conf" },
  { os = "windows", target = "~/AppData/Roaming/mpv/mpv.conf" },
]

[dotfiles.gh]
source = "~/Projects/bootstrap/home/.config/gh"
variants = [
  { os = "linux", target = "~/.config/gh" },
  { os = "windows", target = "~/AppData/Roaming/Github CLI/" },
]

[tasks.apply]
alias = "a"
run = "mise dot apply -y"

[tasks.boot]
alias = "b"
run = "mise bootstrap --skip-dirty"

[tasks.pkg]
alias = "p"
run = "mise bootstrap packages"

[tools]
"aqua:owenlamont/ryl" = { version = "latest", lazy = true, lazy_bins = "ryl" }
hk = { version = "latest", lazy = true }
node = "latest"
oxfmt = { version = "latest", lazy = true }
pkl = { version = "latest", lazy = true }
rumdl = { version = "latest", lazy = true }
shellcheck = "latest"
shellharden = { version = "latest", lazy = true }
shfmt = { version = "latest", lazy = true }
tombi = { version = "latest", lazy = true }
